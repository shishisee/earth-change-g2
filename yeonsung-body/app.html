<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연성이의 몸 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4CC; --dot:#FFE9A3; --ink:#2b2140; --sub:#6e6488; --card:#fff; --line:#2b2140;
  --pink:#FF5C93; --blue:#4CC9F0; --green:#5CC96B; --purple:#9B7BFF; --orange:#FF9F43; --yellow:#FFD04D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#2e2748; --dot:#3a3259; } }
:root[data-theme="dark"]{ --bg:#2e2748; --dot:#3a3259; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink);
  background:var(--bg); background-image:radial-gradient(var(--dot) 3px, transparent 3.5px); background-size:28px 28px; min-height:100vh}
.wrap{max-width:1000px; margin:0 auto; padding:12px 14px 40px}
button{font-family:inherit; color:var(--ink)}
.hidden{display:none !important}
.card{background:var(--card); border:2.5px solid var(--line); border-radius:22px; box-shadow:0 4px 0 var(--line)}
.pb{font-size:1.05rem; background:var(--c,#fff); border:2.5px solid var(--line); border-radius:14px; padding:10px 14px;
  box-shadow:0 3px 0 var(--line); cursor:pointer; transition:transform .08s, box-shadow .08s}
.pb:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.pb:disabled{opacity:.45; cursor:not-allowed}
.pb.full{width:100%}
.pb.main{--c:var(--pink); color:#fff; font-size:1.2rem; padding:13px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:10px 0; background:var(--bg)}
.top h1{margin:0; font-weight:400; font-size:1.45rem; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .top h1{color:#fff} }
.iconbtn{width:44px; height:44px; flex:none; border:2.5px solid var(--line); border-radius:14px; background:#fff; font-size:1.3rem; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.who{flex:none; background:#fff; border:2.5px solid var(--line); border-radius:999px; padding:6px 12px; font-size:.95rem}
.who button{background:none; border:0; color:var(--pink); cursor:pointer; padding:0 0 0 6px; font-size:.95rem}

.login{max-width:420px; margin:18px auto 0; padding:22px; text-align:center}
.login h2{margin:4px 0; font-weight:400; font-size:1.7rem}
.login p{margin:0 0 16px; color:var(--sub)}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; text-align:left}
.fields label{display:flex; flex-direction:column; gap:4px}
.fields .full{grid-column:1/-1}
input{font:inherit; font-size:1.2rem; padding:10px 12px; border:2.5px solid var(--line); border-radius:14px; width:100%; background:#fff; color:var(--ink)}
.err{color:#e0334f; min-height:1.3em; margin:0 0 8px}

.hero{display:flex; align-items:center; gap:12px; margin:4px 0 16px}
.hero svg{width:84px; flex:none}
.bubble{background:#fff; border:2.5px solid var(--line); border-radius:18px; padding:10px 14px; font-size:1.1rem}
.syslist{display:flex; flex-direction:column; gap:12px}
.sysrow{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:20px}
.sysrow .em{width:54px; height:54px; flex:none; border-radius:16px; background:var(--c); border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.8rem}
.sysrow .txt{flex:1; min-width:0}
.sysrow b{display:block; font-weight:400; font-size:1.35rem}
.sysrow small{color:var(--sub); font-size:.92rem}
.sysrow .prog{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:40%}
.sysrow .prog span{font-size:.78rem; background:#f4f0ff; border-radius:999px; padding:3px 8px}
.sysrow .arrow{font-size:1.4rem; color:var(--sub)}

.tabs{display:flex; gap:4px; padding:4px; background:#fff; border:2.5px solid var(--line); border-radius:16px; margin-bottom:12px; overflow-x:auto}
.tab{flex:1 0 auto; border:0; background:transparent; border-radius:11px; padding:9px 12px; font-size:1rem; cursor:pointer; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pink); color:#fff}

.layout{display:grid; gap:14px; grid-template-columns:1fr}
@media (min-width:860px){ .layout{grid-template-columns:minmax(320px,470px) 1fr; align-items:start} }
.stage{position:relative; padding:10px; overflow:hidden}
.stage-in{display:grid; grid-template-columns:1fr; gap:8px}
.stage-in.rail-on{grid-template-columns:1fr 92px}
#body{width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none}
#body.full .slot .line{opacity:0}
#body.spotting #placed > g:not(.spot){opacity:.22}
#placed > g{transition:opacity .2s}
.spot > g{animation:pulse .7s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.pop{animation:pop .45s cubic-bezier(.2,1.8,.4,1); transform-box:fill-box; transform-origin:center}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.flash > g{animation:flash .6s ease-in-out 2; transform-box:fill-box; transform-origin:center}
@keyframes flash{50%{transform:scale(1.15); filter:brightness(1.2)}}

.rail{position:relative}
.rail-scroll{position:absolute; inset:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:2px 2px 8px; scroll-behavior:smooth}
.ritem{position:relative; flex:none; width:100%; border:2px solid #e6e0f2; background:#faf8ff; border-radius:14px; padding:4px 2px 5px; cursor:not-allowed; touch-action:none; user-select:none; -webkit-user-select:none}
.ritem svg{width:100%; height:48px; display:block; overflow:visible}
.ritem .nm{display:block; text-align:center; font-size:.85rem; line-height:1.1}
.ritem .no{position:absolute; top:3px; left:4px; width:18px; height:18px; border-radius:50%; background:#e6e0f2; font-size:.72rem; line-height:18px; text-align:center}
.ritem.lock svg{opacity:.35; filter:grayscale(1)}
.ritem.lock .nm{color:#aaa3bf}
.ritem.now{border-color:var(--pink); background:#fff0f6; cursor:grab; box-shadow:0 3px 0 var(--pink)}
.ritem.now .no{background:var(--pink); color:#fff}
.ritem.now svg{filter:drop-shadow(0 2px 0 rgba(43,33,64,.3))}
.ritem.sel{background:#dff6ff; border-color:var(--blue)}
.ritem.done{background:#effbef; border-color:#c9ecc9}
.ritem.done svg{opacity:.45}
.ritem.done .no{background:var(--green); color:#fff}
.rdiv{flex:none; font-size:.72rem; color:var(--sub); text-align:center; padding:4px 0 0}
.ghost{position:fixed; z-index:60; pointer-events:none; transform:rotate(-6deg) scale(1.35); background:none !important; border:0 !important; box-shadow:none !important}
.ghost .no{display:none}

.panel{padding:16px}
.row{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.chip{display:inline-block; padding:4px 10px; border:2px solid var(--line); border-radius:999px; background:#fff; font-size:.92rem}
.chip.ok{background:var(--green); color:#fff; border-color:var(--green)}
.chip.on{background:var(--pink); color:#fff; border-color:var(--pink)}
.q{font-size:clamp(1.2rem,4.3vw,1.45rem); line-height:1.4; margin:4px 0 14px}
.sub{color:var(--sub); font-size:1rem; margin:0 0 12px; line-height:1.45}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opts.one{grid-template-columns:1fr}
.opts .pb{font-size:1.1rem; min-height:54px}
.opts.ox .pb{font-size:2.1rem; min-height:86px}
.pb.right{--c:var(--green); color:#fff} .pb.wrong{--c:#ffc9c9; opacity:.7}
.pb.pick{--c:#dff6ff; border-color:var(--blue)}
.fb{min-height:1.5em; margin:12px 0 0; font-size:1.12rem; text-align:center}
.fb.good{color:#1f9a4a} .fb.bad{color:#e0334f}
.hint{background:#fff7d6; border:2px dashed #e8c55a; border-radius:14px; padding:10px 12px; font-size:1.05rem; margin-bottom:10px}
.bar{height:12px; border:2px solid var(--line); border-radius:99px; background:#fff; overflow:hidden; margin-bottom:12px}
.bar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s}
.big{font-size:3rem; text-align:center; margin:2px 0}
.center{text-align:center}
.steps{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
.steps .lane{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.steps .lane b{font-weight:400; font-size:.9rem; width:66px; color:var(--sub)}
.steps .lane span{font-size:.85rem; padding:3px 8px; border-radius:999px; background:#f1eef8}
.steps .lane span.ok{background:var(--green); color:#fff}
.steps .lane span.on{background:var(--pink); color:#fff}
.states{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:1.05rem; margin:10px 0 14px; padding:12px; background:#f7f4ff; border-radius:14px}
.states dt{color:var(--sub)} .states dd{margin:0}
.hold{width:100%; padding:20px; font-size:1.3rem; border-radius:18px; touch-action:none; user-select:none; -webkit-user-select:none}
.hold.on{--c:var(--blue); color:#fff; transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.picks{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.picks .pb{font-size:1.02rem; padding:8px 12px}
.stamp{position:absolute; top:12px; right:12px; width:92px; height:92px; border-radius:50%; border:4px solid #e0334f; color:#e0334f;
  outline:2px solid #e0334f; outline-offset:3px; display:flex; align-items:center; justify-content:center; text-align:center;
  line-height:1.1; font-size:1.05rem; background:rgba(255,255,255,.85); transform:rotate(-14deg) scale(0); opacity:0; pointer-events:none; z-index:5}
.stamp.on{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.4); opacity:0}100%{transform:rotate(-14deg) scale(1); opacity:.95}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.walk{animation:squish .28s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom}
@keyframes squish{from{transform:scale(1.1,.9)}to{transform:scale(.93,1.08)}}
.churn{animation:churn .3s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center}
@keyframes churn{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.boing{animation:pop .5s cubic-bezier(.2,1.7,.4,1); transform-box:fill-box; transform-origin:center}
.conf{position:fixed; top:-20px; width:10px; height:14px; z-index:70; border-radius:3px; pointer-events:none; animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#fff; border:2.5px solid var(--line);
  border-radius:999px; padding:8px 16px; box-shadow:0 3px 0 var(--line); z-index:80; font-size:1rem; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap}
.toast.on{opacity:1}
.nb{animation:nb 1s ease-in-out infinite alternate}
@keyframes nb{to{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .spot > g,.pop,.walk,.churn,.boing,.shake,.flash > g,.nb{animation:none} .stamp.on{animation:none; opacity:.95; transform:rotate(-14deg)} }
</style>
</head>
<body>
<div class="wrap">

  <section id="scrLogin" class="card login hidden">
    <div id="loginDoll"></div>
    <h2>연성이의 몸 탐험</h2>
    <p>반, 번호, 이름을 적고 출발!</p>
    <div class="fields">
      <label>반<input id="inCls" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label>번호<input id="inNum" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label class="full">이름<input id="inName" maxlength="10" autocomplete="off"></label>
    </div>
    <p class="err" id="loginErr"></p>
    <button class="pb main full" id="loginGo">탐험 시작!</button>
  </section>

  <section id="scrHome" class="hidden">
    <div class="top"><h1>연성이의 몸 탐험</h1><div class="who" id="who"></div></div>
    <div class="hero"><div id="homeDoll"></div><div class="bubble">내 몸 속을 탐험해 줘!<br>기관계를 골라 봐 👇</div></div>
    <div class="syslist" id="sysList"></div>
  </section>

  <section id="scrSys" class="hidden">
    <div class="top"><button class="iconbtn" id="backHome" aria-label="홈으로">←</button><h1 id="sysTitle"></h1></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="layout">
      <div class="card stage">
        <div class="stage-in" id="stageIn">
          <svg id="body" viewBox="0 0 300 530" aria-label="연성이 몸 그림">
            <defs><linearGradient id="capG" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="290" y2="0"><stop offset="0" stop-color="#FF4D5E"/><stop offset=".55" stop-color="#B06CE0"/><stop offset="1" stop-color="#5B7BFF"/></linearGradient></defs>
            <g id="dollLayer"></g><g id="ctx"></g><g id="slots"></g><g id="placed"></g><g id="fx"></g><g id="neph"></g>
            <g id="char" style="display:none"><g id="charSize"><g id="charBody"></g></g></g>
          </svg>
          <div class="rail hidden" id="rail"><div class="rail-scroll" id="railIn"></div></div>
        </div>
        <div class="stamp" id="stamp"></div>
      </div>
      <div class="card panel" id="panel"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const NS='http://www.w3.org/2000/svg', INK='#2b2140';
const $=id=>document.getElementById(id);
const el=(tag,a={},p)=>{const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e;};
const shuffle=a=>{a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function crPath(pts){
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`; }
  return d;
}
function mirror(d){ let i=0; return d.replace(/-?\d*\.?\d+/g,m=>{ const v=(i++%2===0)?300-parseFloat(m):parseFloat(m); return String(+v.toFixed(2)); }); }
const dots=list=>list.map(([x,y,r])=>`M${x-r} ${y} A${r} ${r} 0 1 0 ${x+r} ${y} A${r} ${r} 0 1 0 ${x-r} ${y} Z`).join(' ');
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1800); }
function confetti(){
  if(REDUCE) return; const cols=['#FF5C93','#4CC9F0','#5CC96B','#FFD04D','#9B7BFF','#FF9F43'];
  for(let i=0;i<46;i++){ const c=document.createElement('i'); c.className='conf';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length]; c.style.animationDelay=Math.random()*.5+'s';
    c.style.animationDuration=(1.4+Math.random())+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3200); }
}
function stampOn(t){ const s=$('stamp'); s.innerHTML=t; s.classList.remove('on'); void s.offsetWidth; s.classList.add('on'); }
function fb(t,good){ const f=$('fb'); if(!f) return; f.textContent=t; f.className='fb '+(good?'good':'bad'); }
const bat=n=>{ const c=String(n).charCodeAt(String(n).length-1)-0xAC00; return c>=0&&c<11172&&c%28!==0; };
const iya=n=>n+(bat(n)?'이야':'야'), eun=n=>n+(bat(n)?'은':'는'), ro=n=>{ const c=String(n).charCodeAt(String(n).length-1)-0xAC00; return n+(bat(n)&&c%28!==8?'으로':'로'); };
function shakeEl(e){ if(!e) return; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }

function drawDoll(g,{mouth=true}={}){
  const skin='#FFF1E3', hair='#4a3566';
  const arm='M52 178 Q30 186 28 216 L26 328 Q26 342 38 342 Q50 342 50 328 Z';
  [arm,mirror(arm)].forEach(d=>el('path',{d,fill:skin,stroke:INK,'stroke-width':3,'stroke-linejoin':'round'},g));
  el('circle',{cx:38,cy:348,r:11,fill:skin,stroke:INK,'stroke-width':3},g); el('circle',{cx:262,cy:348,r:11,fill:skin,stroke:INK,'stroke-width':3},g);
  const leg='M94 498 L94 522 Q94 528 102 528 L130 528 Q136 528 136 522 L136 498 Z';
  [leg,mirror(leg)].forEach(d=>el('path',{d,fill:'#5b7bff',stroke:INK,'stroke-width':3},g));
  el('path',{d:'M112 140 Q150 128 188 140 L238 168 Q258 180 258 212 L250 470 Q248 502 218 506 L82 506 Q52 502 50 470 L42 212 Q42 180 62 168 Z',fill:skin,stroke:INK,'stroke-width':3},g);
  el('path',{d:'M116 142 L150 170 L184 142',fill:'none',stroke:INK,'stroke-width':2.5,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.4},g);
  el('rect',{x:136,y:112,width:28,height:34,fill:skin},g);
  el('path',{d:'M136 114 L136 142 M164 114 L164 142',stroke:INK,'stroke-width':3},g);
  el('circle',{cx:98,cy:86,r:10,fill:skin,stroke:INK,'stroke-width':3},g); el('circle',{cx:202,cy:86,r:10,fill:skin,stroke:INK,'stroke-width':3},g);
  el('circle',{cx:150,cy:78,r:54,fill:skin,stroke:INK,'stroke-width':3},g);
  el('path',{d:'M94 86 Q86 20 150 18 Q214 20 206 86 Q204 64 190 52 Q180 70 162 58 Q152 72 138 58 Q122 72 110 54 Q98 64 94 86 Z',fill:hair,stroke:INK,'stroke-width':2.5,'stroke-linejoin':'round'},g);
  el('path',{d:'M150 20 Q140 2 158 2',fill:'none',stroke:hair,'stroke-width':4,'stroke-linecap':'round'},g);
  el('path',{d:'M186 34 L189 41 L197 42 L191 47 L193 55 L186 51 L179 55 L181 47 L175 42 L183 41 Z',fill:'#FFD04D',stroke:INK,'stroke-width':2,'stroke-linejoin':'round'},g);
  [128,172].forEach(x=>{ el('ellipse',{cx:x,cy:80,rx:7.5,ry:9.5,fill:INK},g); el('circle',{cx:x+2.8,cy:75.5,r:3,fill:'#fff'},g); el('circle',{cx:x-2.5,cy:84,r:1.4,fill:'#fff'},g); });
  el('ellipse',{cx:112,cy:97,rx:9,ry:5,fill:'#FF8FB1',opacity:.8},g); el('ellipse',{cx:188,cy:97,rx:9,ry:5,fill:'#FF8FB1',opacity:.8},g);
  if(mouth) el('path',{d:'M143 100 Q146.5 105 150 100 Q153.5 105 157 100',fill:'none',stroke:INK,'stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round'},g);
}
function dollSvg(w){ const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 -6 300 540'); s.style.width=w+'px'; drawDoll(el('g',{},s)); return s; }

function face(g,cx,cy,s){
  el('circle',{cx:cx-7*s,cy,r:2.8*s,fill:INK},g); el('circle',{cx:cx+7*s,cy,r:2.8*s,fill:INK},g);
  el('circle',{cx:cx-6.2*s,cy:cy-1*s,r:1*s,fill:'#fff'},g); el('circle',{cx:cx+7.8*s,cy:cy-1*s,r:1*s,fill:'#fff'},g);
  el('path',{d:`M${cx-3.5*s} ${cy+4*s} Q${cx} ${cy+8*s} ${cx+3.5*s} ${cy+4*s}`,fill:'none',stroke:INK,'stroke-width':1.6*s+.4,'stroke-linecap':'round'},g);
  el('ellipse',{cx:cx-12*s,cy:cy+4*s,rx:3.6*s,ry:2.2*s,fill:'#FF6F9F',opacity:.7},g);
  el('ellipse',{cx:cx+12*s,cy:cy+4*s,rx:3.6*s,ry:2.2*s,fill:'#FF6F9F',opacity:.7},g);
}
function drawOrgan(o,parent){
  const g=el('g',{},parent);
  if(o.type==='tube'){
    const c={fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
    el('path',{...c,d:o.d,stroke:'#fff','stroke-width':o.noHalo?0:o.sw+11},g);
    el('path',{...c,d:o.d,stroke:INK,'stroke-width':o.sw+4.5},g);

  hb.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter') on(e); }); hb.addEventListener('keyup',off);
  const rows=['갈비뼈','횡격막','흉강 부피','폐 속 압력','공기'];
  const vals={in:['올라감 ⬆','내려감 ⬇','커짐','낮아짐','밖 → 폐 (들숨)'],out:['내려감 ⬇','올라감 ⬆','작아짐','높아짐','폐 → 밖 (날숨)'],idle:['-','-','-','-','-']};
  let lastState='';
  const loop=()=>{
    if(runId!==my) return;
    v+=((holding?1:0)-v)*(REDUCE?1:.07);
    const st=holding?'in':(v>.03?'out':'idle'), moving=holding?v<.97:v>.03;
    [['lungL',100],['lungR',200]].forEach(([id,cx])=>holders[id]&&holders[id].setAttribute('transform',`translate(${cx} 176) scale(${1+.07*v} ${1+.12*v}) translate(${-cx} -176)`));
    if(holders.diaphragm) holders.diaphragm.querySelectorAll('path').forEach(p=>p.setAttribute('d',`M58 ${338+8*v} Q150 ${294+32*v} 242 ${338+8*v}`));
    ribs.setAttribute('transform',`translate(0 ${-8*v})`);
    air.textContent=!moving?'':st==='in'?'⬇ 공기 들어옴':'⬆ 공기 나감'; air.setAttribute('fill',st==='in'?'#2a8fc0':'#e0334f');
    if(st!==lastState){ lastState=st; $('states').innerHTML=rows.map((r,i)=>`<dt>${r}</dt><dd>${vals[st][i]}</dd>`).join(''); }
    if(v>.85) peak=true;
    if(peak&&!holding&&v<.12){ peak=false; count++; $('bcnt').textContent=`숨쉬기 ${Math.min(count,3)} / 3`; if(count===3) breathQuiz(); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function breathQuiz(){
  const QS=[['숨을 들이쉴 때 횡격막은?',['내려간다','올라간다']],['숨을 들이쉴 때 폐 속 압력은?',['낮아진다','높아진다']],['숨을 내쉴 때 갈비뼈는?',['내려간다','올라간다']]];
  let i=0, miss=0; const my=runId;
  const showB=()=>{
    if(runId!==my) return;
    if(i>=QS.length){ confetti(); stampOn('호흡<br>박사'); saveProg(curKey,{breath:true}); record({system:cur.name,mode:'숨쉬기 실험',score:miss,total:QS.length});
      $('bq').innerHTML=`<p class="q center">🎉 호흡 운동 완벽 이해!</p><p class="sub center">들숨: 갈비뼈 ⬆ 횡격막 ⬇ → 흉강 커짐 → 폐 압력 낮아짐 → 공기 들어옴</p>`; return; }
    const [q,o]=QS[i];
    $('bq').innerHTML=`<p class="q">확인 ${i+1}. ${q}</p><div class="opts" id="bopts"></div><p class="fb" id="fb"></p>`;
    shuffle(o).forEach(x=>{ const b=document.createElement('button'); b.className='pb'; b.textContent=x;
      b.onclick=async()=>{ if(x===o[0]){ b.classList.add('right'); fb('정답! 🎉',true); await sleep(700); i++; showB(); } else { miss++; b.classList.add('wrong'); b.disabled=true; fb('땡! 다시 해 봐',false); } };
      $('bopts').appendChild(b); });
  };
  showB();
}

function badge(k){ Object.entries(N.badges).forEach(([kk,b])=>{ b.setAttribute('opacity',kk===k?1:.25); b.classList.toggle('nb',kk===k); }); }
function moveP(k,x,y,dur=900){
  const P=N.parts[k]; const fx0=P.x, fy0=P.y; P.x=x; P.y=y; if(REDUCE) dur=0;
  return new Promise(res=>{ const t0=performance.now(); const step=now=>{ const kq=dur?Math.min(1,(now-t0)/dur):1, e=kq<.5?2*kq*kq:1-Math.pow(-2*kq+2,2)/2;
    P.g.setAttribute('transform',`translate(${(fx0+(x-fx0)*e).toFixed(1)} ${(fy0+(y-fy0)*e).toFixed(1)})`); if(kq<1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
}

function pickUI(title,sub,items,correct,onOk,tag){
  const chosen=new Set();
  $('panel').innerHTML=`<div class="row"><span class="chip on">${tag}</span><span class="chip">틀린 횟수 ${N.miss}</span></div>
    <p class="q">${title}</p><p class="sub">${sub}</p><div class="picks" id="picks"></div>
    <button class="pb main full" id="chk">확인!</button><p class="fb" id="fb"></p>`;
  items.forEach(s=>{ const b=document.createElement('button'); b.className='pb'; b.textContent=s.t;
    b.onclick=()=>{ chosen.has(s.k)?chosen.delete(s.k):chosen.add(s.k); b.classList.toggle('pick',chosen.has(s.k)); }; $('picks').appendChild(b); });
  $('chk').onclick=()=>{
    const wrongIn=[...chosen].filter(k=>!correct.includes(k)), missed=correct.filter(k=>!chosen.has(k));
    if(!wrongIn.length&&!missed.length){ $('chk').disabled=true; onOk(); return; }
    N.miss++; shakeEl($('panel'));
    const nm=k=>items.find(s=>s.k===k).t;
    fb(wrongIn.length?`${eun(nm(wrongIn[0]).split(' ').pop())} 아니야! 다시 골라 봐`:`하나 더 있어! (${missed.length}개 빠짐)`,false);
  };
}
