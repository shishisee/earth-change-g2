<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>연성이의 기초 탐험</title>
<script>
/* 연성이의 몸 탐험(/app)과 같은 주소라서, 이 페이지의 저장 기록은 따로 보관 (ys- → yb-o-ys-) */
(function(){var P=Storage.prototype,g=P.getItem,s=P.setItem,r=P.removeItem,f=function(k){k=String(k);return k.indexOf('ys-')===0?'yb-o-'+k:k};
P.getItem=function(k){return g.call(this,f(k))};P.setItem=function(k,v){return s.call(this,f(k),v)};P.removeItem=function(k){return r.call(this,f(k))};})();
window.__APP=fetch('/app',{cache:'no-store'}).then(function(r){return r.text()});
</script>
<style>html,body{margin:0;height:100%;background:#FFF4CC;font-family:"Apple SD Gothic Neo",sans-serif;color:#2b2140}#boot{height:100%;display:flex;align-items:center;justify-content:center;font-size:18px}</style>
</head>
<body>
<div id="boot">🫀 연성이를 불러오는 중…</div>
<script src="/basic-rooms.js"></script>
<script src="/basic-patch.js"></script>
<script src="/basic-fig.js"></script>
<script>
/* 원래 사이트(/app)를 받아 그대로 띄우고, 그 위에 기초 탐험(basic-patch.js)을 얹는다 */
window.__APP.then(function(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var scripts=[].slice.call(doc.querySelectorAll('script'));
  scripts.forEach(function(s){s.parentNode.removeChild(s)});
  document.replaceChild(document.adoptNode(doc.documentElement),document.documentElement);
  scripts.forEach(function(s){var n=document.createElement('script');if(s.src)n.src=s.getAttribute('src');else n.textContent=s.textContent;document.body.appendChild(n)});
  window.__BASIC();
}).catch(function(){var b=document.getElementById('boot');if(b)b.innerHTML='잠깐 불러오지 못했어요. 새로고침해 주세요.'});
</script>
</body>
</html>
